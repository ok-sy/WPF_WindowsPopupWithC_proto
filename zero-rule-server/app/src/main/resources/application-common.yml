spring:
  config:
    activate:
      on-profile:
        - common
  servlet:
    multipart.max-file-size: 4096MB
    multipart.max-request-size: 4096MB
  lifecycle:
    timeout-per-shutdown-phase: 30s
  pid:
    file: cloverserver.pid

logging:
  config: classpath:logback.xml

server:
  port: 8080
  servlet:
    context-path: /zero-rule-server
  max-http-header-size: 8192
  tomcat:
    max-http-form-post-size: 4096MB
  shutdown: graceful

custom.auth-header:
  user-refresh-token-header: "x-custom-authorization"
  user-clear-header: "x-custom-authorization-clear"

custom.server-security:
  allowed-origins:
    - http://localhost:3000
    - http://localhost:3001
    - https://zerorule.labcl.net
    - http://zerorule.labcl.net
    - http://localhost:6443
    - http://localhost:8080
    - http://192.168.184.134:6443
    - http://192.168.184.134:8080

custom.user-security:
  debug-login-fail: true
  passwd-reset-token-expire: 60m

custom.user-jwt:
  token-secret: 926D96C90030DD58429D2751AC1BDBBC
  token-expiration: 120m
  token-expiration-long: 6h
  allow-dup-login: true

# [WPF 팝업 API 추가 — 기준 3·4·6] 신규 /p/api/wpf/** 설정. 기존 custom.* 항목은 변경하지 않는다.
#  - polling-interval-seconds: 목록 응답에 실어 WPF 주기 조회 간격을 서버가 통제
#  - dev-user-header(기본 false = WpfPopupProps 기본값): true면 X-Dev-User-Id 헤더로 사번을 지정하는 개발용 식별기 활성.
#    통합 토큰 필터(타 팀)가 적용되면 SecurityContext 기반 식별기가 사용된다.
#    ※ 여기(common)에는 적지 않는다 — 프로파일 그룹 활성 순서가 local → common 이어서 common 값이 local 값을 덮어쓴다
#      (전체 서버 기동 확인에서 발견). 개발용 true는 application-local.yml 에만 둔다.
custom.wpf-popup:
  polling-interval-seconds: 1800

# [WPF SSO·토큰 프로토타입 — 설계 10] POST /p/api/wpf/auth/login + Bearer 토큰 검사(WpfAuthPrototypeProps, custom.wpf-auth-prototype).
#  운영 인증(타 팀 통합 토큰)이 아니라 통신 형태·401 재로그인 검증용이므로 기본 enabled=false(props 기본값).
#  ※ dev-user-header와 같은 이유(common 값이 local 값을 덮어씀)로 여기에는 값을 적지 않고, 켜는 설정은 application-local.yml 에만 둔다.

# [WPF 클라이언트 버전 검증 — 설계 13] /p/api/wpf/** 요청의 X-Client-Version 헤더를 최소 지원 버전과 숫자 비교(WpfClientVersionInterceptor).
#  - latest-version            : 현재 배포된 최신 WPF 버전(426 응답 안내용). WPF csproj <Version>과 함께 올린다.
#  - minimum-supported-version : 이 버전 미만 WPF 요청은 컨트롤러 진입 전 426 Upgrade Required. 비우면 검증 안 함.
#  - require-header            : true면 헤더 없는 요청도 426(구 클라이언트 우회 방지). 헤더 없는 구 클라이언트를 잠시 허용하려면 false.
#  프로파일 그룹 순서(local → common)상 common 값이 최종 적용되므로 환경별로 다르게 하려면 환경변수
#  CUSTOM_WPF_CLIENT_MINIMUM_SUPPORTED_VERSION / CUSTOM_WPF_CLIENT_LATEST_VERSION 으로 덮어쓴다.
custom.wpf-client:
  latest-version: 1.0.0
  minimum-supported-version: 1.0.0
  require-header: true
