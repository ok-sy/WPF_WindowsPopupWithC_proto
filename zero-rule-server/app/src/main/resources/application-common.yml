spring:
  config:
    activate:
      on-profile:
        - common
  servlet:
    multipart.max-file-size: 4096MB
    multipart.max-request-size: 4096MB
  lifecycle:
    timeout-per-shutdown-phase: 30s
  pid:
    file: cloverserver.pid

logging:
  config: classpath:logback.xml

server:
  port: 8080
  servlet:
    context-path: /zero-rule-server
  max-http-header-size: 8192
  tomcat:
    max-http-form-post-size: 4096MB
  shutdown: graceful

custom.auth-header:
  user-refresh-token-header: "x-custom-authorization"
  user-clear-header: "x-custom-authorization-clear"

custom.server-security:
  allowed-origins:
    - http://localhost:3000
    - http://localhost:3001
    - https://zerorule.labcl.net
    - http://zerorule.labcl.net
    - http://localhost:6443
    - http://localhost:8080
    - http://192.168.184.134:6443
    - http://192.168.184.134:8080

custom.user-security:
  debug-login-fail: true
  passwd-reset-token-expire: 60m

custom.user-jwt:
  token-secret: 926D96C90030DD58429D2751AC1BDBBC
  token-expiration: 120m
  token-expiration-long: 6h
  allow-dup-login: true

# [WPF 팝업 API 추가 — 기준 3·4·6] 신규 /p/api/wpf/** 설정. 기존 custom.* 항목은 변경하지 않는다.
#  - polling-interval-seconds: 목록 응답에 실어 WPF 주기 조회 간격을 서버가 통제
#  - dev-user-header(기본 false = WpfPopupProps 기본값): true면 X-Dev-User-Id 헤더로 사번을 지정하는 개발용 식별기 활성.
#    통합 토큰 필터(타 팀)가 적용되면 SecurityContext 기반 식별기가 사용된다.
#    ※ 여기(common)에는 적지 않는다 — 프로파일 그룹 활성 순서가 local → common 이어서 common 값이 local 값을 덮어쓴다
#      (전체 서버 기동 확인에서 발견). 개발용 true는 application-local.yml 에만 둔다.
custom.wpf-popup:
  polling-interval-seconds: 1800
